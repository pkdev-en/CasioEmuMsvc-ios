name: Auto build and pre-release

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Build target"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows-x64
          - windows-x86
          - android
          - linux
          - macos
          - ios
          - web
  push:
    branches: [ "stable", "master" ]

env:
  BUILD_CONFIGURATION: Release
  CASIOEMU_ONLINE_BUILD_KEY_ID: ${{ secrets.CASIOEMU_ONLINE_BUILD_KEY_ID }}
  CASIOEMU_ONLINE_BUILD_KEY_B64: ${{ secrets.CASIOEMU_ONLINE_BUILD_KEY_B64 }}
  CASIOEMU_ONLINE_SERVER_KEY_ID: ${{ secrets.CASIOEMU_ONLINE_SERVER_KEY_ID }}
  CASIOEMU_ONLINE_SERVER_PUBLIC_KEY_B64: ${{ secrets.CASIOEMU_ONLINE_SERVER_PUBLIC_KEY_B64 }}

permissions:
  contents: write

jobs:
  build:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.target != 'web'
    strategy:
      matrix:
        include:
          - platform: windows
            platform_arch: x64
            os: windows-latest
            name: "Windows-x64"
          - platform: windows
            platform_arch: x86
            os: windows-latest
            name: "Windows-x86"
          - platform: android
            os: ubuntu-latest
            name: "Android"
          - platform: mac
            os: macos-latest
            name: "macOS"
          - platform: linux
            os: ubuntu-latest
            name: "Linux-x64"
          - platform: ios
            os: macos-latest
            name: "iOS"
    
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.name }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Configure CMake
      if: matrix.platform == 'windows'
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: cmake -S . -B build -A ${{ matrix.platform_arch == 'x86' && 'Win32' || 'x64' }} -DCMAKE_BUILD_TYPE=${{ env.BUILD_CONFIGURATION }} -DBUILD_EXECUTABLE=ON

    - name: Build with CMake
      if: matrix.platform == 'windows'
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: cmake --build build --config ${{ env.BUILD_CONFIGURATION }} --parallel

    - name: Check Sentry token
      if: matrix.platform == 'windows'
      shell: pwsh
      run: |
        if ("${{ secrets.SENTRY_TOKEN }}" -ne "") {
          "HAS_SENTRY_TOKEN=true" >> $env:GITHUB_ENV
        } else {
          "HAS_SENTRY_TOKEN=false" >> $env:GITHUB_ENV
          Write-Host "SENTRY_TOKEN is not configured; skipping PDB upload."
        }

    - name: Upload PDBs to Sentry
      if: matrix.platform == 'windows' && env.HAS_SENTRY_TOKEN == 'true'
      env:
        SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_TOKEN }}
        SENTRY_ORG: "t5-j7"
        SENTRY_PROJECT: "native"
        COMMIT_HASH: ${{ github.sha }}
        RELEASE_TAG: "CasioEmuMsvc@${{ github.sha }}"
      working-directory: build/CasioEmuMsvc/${{ env.BUILD_CONFIGURATION }}
      run: |
            $sentry_cli = "${{ github.workspace }}\CasioEmuMsvc\sentry-cli.exe"
            & $sentry_cli debug-files upload -o $env:SENTRY_ORG -p $env:SENTRY_PROJECT .

    - name: Upload ${{ matrix.platform_arch }} Build Artifact
      if: matrix.platform == 'windows'
      uses: actions/upload-artifact@v7
      with:
        name: Release-${{ matrix.platform_arch }}
        path: build/CasioEmuMsvc/${{ env.BUILD_CONFIGURATION }}
        if-no-files-found: error
    
    # ================= MACOS =================
    - name: Install dependencies (macOS)
      if: matrix.platform == 'mac'
      run: |
        brew install cmake sdl2 sdl2_image ccache ninja
    
    - name: Build icons for macOS
      if: matrix.platform == 'mac'
      run: |
        set -e
    
        ICONSET=AppIcon.iconset
        IMG=resources/new-logo.png
    
        rm -rf $ICONSET
        mkdir $ICONSET
    
        # generate iconset (macOS standard sizes)
        sips -z 16 16     "$IMG" --out $ICONSET/icon_16x16.png
        sips -z 32 32     "$IMG" --out $ICONSET/icon_16x16@2x.png
    
        sips -z 32 32     "$IMG" --out $ICONSET/icon_32x32.png
        sips -z 64 64     "$IMG" --out $ICONSET/icon_32x32@2x.png
    
        sips -z 128 128   "$IMG" --out $ICONSET/icon_128x128.png
        sips -z 256 256   "$IMG" --out $ICONSET/icon_128x128@2x.png
    
        sips -z 256 256   "$IMG" --out $ICONSET/icon_256x256.png
        sips -z 512 512   "$IMG" --out $ICONSET/icon_256x256@2x.png
    
        sips -z 512 512   "$IMG" --out $ICONSET/icon_512x512.png
        sips -z 1024 1024 "$IMG" --out $ICONSET/icon_512x512@2x.png
    
        iconutil -c icns $ICONSET -o AppIcon.icns
        
        mkdir -p MacResources
        cp AppIcon.icns MacResources/AppIcon.icns
        
        echo "CCACHE_COMPRESS=1" >> $GITHUB_ENV
        echo "CCACHE_MAXSIZE=400M" >> $GITHUB_ENV
    
    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: mac-ccache-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}
    
    - name: Build for macOS
      if: matrix.platform == 'mac'
      env:
        MACOSX_DEPLOYMENT_TARGET: 11.0
      run: |
        cmake -S . -B build \
        -G Ninja \
        -DBUILD_EXECUTABLE=ON \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
        -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
        -DCMAKE_C_COMPILER_LAUNCHER=ccache \
        -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
        -DCMAKE_CXX_FLAGS="-fdiagnostics-color=always"
        
        cmake --build build --parallel 6
    
    - name: Show build tree
      if: matrix.platform == 'mac'
      run: |
        echo "---- BUILD TREE ----"
        ls -R build
    
    - name: Create DMG
      if: matrix.platform == 'mac'
      run: |
        cd build
        APP=$(find . -name "*.app" | head -n 1)
        echo "Found app: $APP"
    
        mkdir dmg
        cp -r "$APP" dmg/
        ln -s /Applications dmg/Applications
        
        hdiutil create CasioEmuMsvc.dmg \
          -volname "CasioEmuMsvc" \
          -srcfolder dmg \
          -ov \
          -format UDZO
    
    - name: Upload macOS Build Artifact
      if: matrix.platform == 'mac'
      uses: actions/upload-artifact@v7
      with:
        path: |
          build/CasioEmuMsvc.dmg
        # compression-level: 6
        retention-days: 1
        archive: false
    

    - name: Set up JDK 21
      if: matrix.platform == 'android'
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission to gradlew
      if: matrix.platform == 'android'
      run: chmod +x gradlew

    - name: Build with Gradle
      if: matrix.platform == 'android'
      run: ./gradlew assembleRelease

    - name: Rename APK
      if: matrix.platform == 'android'
      run: |
        SHORT_HASH=$(git rev-parse --short HEAD)
        for apk in app/build/outputs/apk/release/*.apk; do
          if [ -f "$apk" ]; then
            mv "$apk" "${apk%.apk}-${SHORT_HASH}.apk"
          fi
        done

    - name: Upload Universal APK
      if: matrix.platform == 'android'
      uses: actions/upload-artifact@v7
      with:
        path: app/build/outputs/apk/release/*-universal-*.apk
        archive: false

    - name: Upload arm64-v8a APK
      if: matrix.platform == 'android'
      uses: actions/upload-artifact@v7
      with:
        path: app/build/outputs/apk/release/*-arm64-v8a-*.apk
        archive: false

    - name: Upload armeabi-v7a APK
      if: matrix.platform == 'android'
      uses: actions/upload-artifact@v7
      with:
        path: app/build/outputs/apk/release/*-armeabi-v7a-*.apk
        archive: false

    - name: Grant execute permission to build script
      if: matrix.platform == 'linux'
      run: chmod +x build-linux.sh

    - name: Build for Linux
      if: matrix.platform == 'linux'
      run: sudo DEBIAN_FRONTEND=noninteractive ./build-linux.sh -y

    - name: Upload Linux Build Artifact
      if: matrix.platform == 'linux'
      uses: actions/upload-artifact@v7
      with:
        name: Release-Linux-x64
        path: |
          build/CasioEmuMsvc/CasioEmuMsvc
          build/CasioEmuMsvc/crashpad_handler
          build/CasioEmuMsvc/locales/
          build/CasioEmuMsvc/roms.db
        if-no-files-found: error
    
    - name: Setup certficate for iOS build
      if: matrix.platform == 'ios'
      run: |
        security create-keychain -p "" build.keychain
        security unlock-keychain -p "" build.keychain
    
        security set-keychain-settings -lut 21600 build.keychain
        security list-keychains -d user -s build.keychain
        security default-keychain -s build.keychain
    
        security import iOSResources/export_anar.p12 \
          -k build.keychain \
          -P "1234" \
          -A \
          -T /usr/bin/codesign
    
        security set-key-partition-list \
          -S apple-tool:,apple: \
          -s \
          -k "" \
          build.keychain
        
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp iOSResources/export_anar.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
    
    - name: Build for iOS
      if: matrix.platform == 'ios'
      run: |
        # Build without code signing - sign manually in the .ipa step.
        # Setting CODE_SIGNING_ALLOWED=NO on ALL_BUILD prevents the
        # "conflicting provisioning settings" error on SDL subprojects.
        cmake -S . -B build -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
          -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
          -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM="4Z7V3V3G9R" \
          -DCMAKE_CXX_STANDARD=20 \
          -DSDL_TESTS=OFF \
          -DSDL_DISABLE_INSTALL=ON \
          -DSDL2IMAGE_TESTS=OFF \
          -DSDL2IMAGE_INSTALL=OFF

        cmake --build build --config Release --parallel 6

    - name: Create .ipa
      if: matrix.platform == 'ios'
      run: |
        set -e

        APP=$(find build -type d -name "*.app" | head -n 1)
        echo "Found app: $APP"

        # Find signing identity from keychain (use first available Distribution or Developer cert)
        IDENTITY=$(security find-identity -v -p codesigning build.keychain \
          | grep -E '"[^"]+"' -o | head -n 1 | tr -d '"')

        if [ -z "$IDENTITY" ]; then
          echo "No identity found in build.keychain, falling back to ad-hoc signing"
          IDENTITY="-"
        fi

        echo "Signing with identity: $IDENTITY"

        if /usr/bin/codesign --force --sign "$IDENTITY" "$APP"; then
          echo "Signing succeeded"
        else
          echo "Signing failed, continuing with unsigned app"
        fi

        mkdir -p build/Payload
        rm -rf build/Payload/*
        cp -R "$APP" build/Payload/

        cd build
        zip -r CasioEmuMsvc.ipa Payload
        cd ..
        
    - name: upload build ios
      if: always() && matrix.platform == 'ios'
      uses: actions/upload-artifact@v7
      with:
        path: build/CasioEmuMsvc.ipa
        retention-days: 1
        archive: false
    - name: upload build failed ios
      if: failure() && matrix.platform == 'ios'
      uses: actions/upload-artifact@v7
      with:
        path: build/CasioEmuMsvc.ipa
        retention-days: 1
        archive: false
    
    - name: Dump CMake error
      if: failure()
      shell: bash
      run: |
        find . -name "CMakeError.log" -exec cat {} \;
        find . -name "CMakeOutput.log" -exec cat {} \;

    - name: Configure CMake
      if: matrix.platform == 'macos'
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_CONFIGURATION }} -DBUILD_EXECUTABLE=ON -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"

    - name: Build with CMake
      if: matrix.platform == 'macos'
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: cmake --build build --config ${{ env.BUILD_CONFIGURATION }} --parallel

    - name: Code Sign App Bundle
      if: matrix.platform == 'macos'
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: codesign --force --deep --sign - build/CasioEmuMsvc/CasioEmuMsvc.app # it may seem unnecessary but it is for precautionary purposes

    - name: Package App Bundle
      if: matrix.platform == 'macos'
      working-directory: build/CasioEmuMsvc
      run: ditto -c -k --sequesterRsrc --keepParent CasioEmuMsvc.app CasioEmuMsvc-macos.zip

    - name: Upload macOS Build Artifact
      if: matrix.platform == 'macos'
      uses: actions/upload-artifact@v7
      with:
        path: build/CasioEmuMsvc/CasioEmuMsvc-macos.zip
        if-no-files-found: error
        archive: false

  web-build:
    runs-on: ubuntu-latest
    name: Build Web
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.event.inputs.target == 'all' ||
      github.event.inputs.target == 'web'

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build python3 python3-pip

    - name: Install Emscripten
      run: |
        git clone https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
        "$RUNNER_TEMP/emsdk/emsdk" install latest
        "$RUNNER_TEMP/emsdk/emsdk" activate latest

    - name: Build CASIOEMU_WEB
      run: |
        source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
        emcmake cmake -S CasioEmuMsvc -B CasioEmuMsvc/build-web -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_CONFIGURATION }} \
          -DCASIOEMU_WEB=ON \
          -DBUILD_EXECUTABLE=ON
        cmake --build CasioEmuMsvc/build-web --config ${{ env.BUILD_CONFIGURATION }} --parallel

    - name: Upload CASIOEMU_WEB Artifact
      uses: actions/upload-artifact@v7
      with:
        name: Release-Web-CASIOEMU_WEB
        path: |
          CasioEmuMsvc/build-web/CasioEmuWeb.*
        if-no-files-found: error

    - name: Build CASIOEMU_CORE_WEB
      run: |
        source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
        emcmake cmake -S CasioEmuMsvc -B CasioEmuMsvc/build-core-web -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_CONFIGURATION }} \
          -DCASIOEMU_CORE_WEB=ON \
          -DBUILD_EXECUTABLE=ON
        cmake --build CasioEmuMsvc/build-core-web --config ${{ env.BUILD_CONFIGURATION }} --parallel

    - name: Upload CASIOEMU_CORE_WEB Artifact
      uses: actions/upload-artifact@v7
      with:
        name: Release-Web-CASIOEMU_CORE_WEB
        path: |
          CasioEmuMsvc/build-core-web/CasioEmuCore.*
        if-no-files-found: error

  release:
    name: Create Release
    needs: [build, web-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/stable'

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Download All Artifacts
      uses: actions/download-artifact@v8
      with:
        path: ./artifacts
        skip-decompress: true
        merge-multiple: true

    - name: Generate Release Details
      id: release_details
      run: |
        SHORT_HASH=$(git rev-parse --short HEAD)
        echo "COMMIT_HASH=$SHORT_HASH" >> $GITHUB_ENV
        echo "RELEASE_TAG=stable-$(date +'%Y%m%d%H%M%S')-$SHORT_HASH" >> $GITHUB_ENV
        echo "RELEASE_DATE=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
        PREV_TAG=$(git describe --tags --match "stable-*" --abbrev=0 2>/dev/null | tr -d '\n' | tr -d '\r')
        if [ -z "$PREV_TAG" ]; then
          CHANGELOG_CONTENT=$(git log -5 --pretty=format:"- %s (%h)" --abbrev-commit)
        else
          CHANGELOG_CONTENT=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --abbrev-commit)
          if [ -z "$CHANGELOG_CONTENT" ]; then
            CHANGELOG_CONTENT="- No changes"
          fi
        fi
        echo "CHANGELOG<<EOF" >> $GITHUB_ENV
        echo "$CHANGELOG_CONTENT" >> $GITHUB_ENV
        echo "EOF" >> $GITHUB_ENV

    - name: Prepare Release Assets
      run: |
        mkdir -p release_assets
        if ls ./artifacts/*.apk 1> /dev/null 2>&1; then
          cp ./artifacts/*.apk release_assets/
        fi

        if [ -f "./artifacts/Release-x86.zip" ]; then
          mv "./artifacts/Release-x86.zip" "./release_assets/windows-x86-${{ env.COMMIT_HASH }}.zip"
        fi

        if [ -f "./artifacts/Release-x64.zip" ]; then
          mv "./artifacts/Release-x64.zip" "./release_assets/windows-x64-${{ env.COMMIT_HASH }}.zip"
        fi

        if [ -f "./artifacts/Release-Linux-x64.zip" ]; then
          mv "./artifacts/Release-Linux-x64.zip" "./release_assets/linux-x64-${{ env.COMMIT_HASH }}.zip"
        fi
        
        if [ -f "./artifacts/CasioEmuMsvc.dmg" ]; then
          mv "./artifacts/CasioEmuMsvc.dmg" "./release_assets/macOS-universal-${{ env.COMMIT_HASH }}.dmg"
        fi
        
        if [ -f "./artifacts/CasioEmuMsvc.ipa" ]; then
          mv "./artifacts/CasioEmuMsvc.ipa" "./release_assets/iOS-build-${{ env.COMMIT_HASH }}.ipa"
        fi

        if [ -f "./artifacts/Release-Web-CASIOEMU_WEB.zip" ]; then
          mv "./artifacts/Release-Web-CASIOEMU_WEB.zip" "./release_assets/web-casioemu-web-${{ env.COMMIT_HASH }}.zip"
        fi

        if [ -f "./artifacts/Release-Web-CASIOEMU_CORE_WEB.zip" ]; then
          mv "./artifacts/Release-Web-CASIOEMU_CORE_WEB.zip" "./release_assets/web-casioemu-core-web-${{ env.COMMIT_HASH }}.zip"
        fi

        if [ -f "./artifacts/CasioEmuMsvc-macos.zip" ]; then
          mv "./artifacts/CasioEmuMsvc-macos.zip" "./release_assets/macos-universal-${{ env.COMMIT_HASH }}.zip"
        fi

        echo "=== ARTIFACTS ==="
        ls -R ./artifacts
        
        echo "=== IPA SEARCH ==="
        find ./artifacts -name "*.ipa"
        
        echo "=== DMG SEARCH ==="
        find ./artifacts -name "*.dmg"
        
        ls -la release_assets/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: 'Auto Build ${{ env.RELEASE_TAG }} (Pre-release)'
        body: |
          ## [WARNING] Pre-release Auto Build
          
          > **Warning**: This is an automated pre-release build for testing purposes.
          > It may contain bugs and is not recommended for production use.
          
          **Build Date:** ${{ env.RELEASE_DATE }}
          **Commit:** [${{ env.COMMIT_HASH }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          
          ### Recent Changes
          ${{ env.CHANGELOG }}
          
          ### Notes
          - This is an automated build from the latest commit on the stable branch
          - Use at your own risk - this is a development build
        files: release_assets/*
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
