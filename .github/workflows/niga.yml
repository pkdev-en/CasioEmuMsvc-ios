name: Xcode skibidi

on:
  workflow_dispatch:
  push:
    branches: ["stable", "master"]
    paths:
      - "CasioEmuMsvc/**"
      - "CMakeLists.txt"
      - ".github/workflows/niga.yml"

jobs:
  generate:
    runs-on: macos-latest
    name: Generate + build (iOS)

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Configure — generate Xcode project
        id: configure
        run: |
          # Same CMake invocation as the full iOS build job. This step is
          # what actually writes the .xcodeproj to disk.
          cmake -S . -B build -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY="" \
            -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM="4Z7V3V3G9R" \
            -DCMAKE_CXX_STANDARD=20 \
            -DSDL_TESTS=OFF \
            -DSDL_DISABLE_INSTALL=ON \
            -DSDL2IMAGE_TESTS=OFF \
            -DSDL2IMAGE_INSTALL=OFF

      - name: Verify project was written
        run: |
          PROJ=$(find build -maxdepth 1 -name "*.xcodeproj")
          if [ -z "$PROJ" ]; then
            echo "No .xcodeproj found in build/ — CMake configure step failed silently."
            exit 1
          fi
          echo "Generated: $PROJ"

      - name: Zip the .xcodeproj
        run: |
          cd build
          PROJ=$(find . -maxdepth 1 -name "*.xcodeproj")
          zip -r "../CasioEmuMsvc.xcodeproj.zip" "$PROJ"

      - name: Upload .xcodeproj artifact
        uses: actions/upload-artifact@v4
        with:
          name: CasioEmuMsvc-xcodeproj
          path: CasioEmuMsvc.xcodeproj.zip
          retention-days: 14
        # Uploaded before the actual build below, so you still get the
        # project file even if the compile step after this fails.

      - name: Build for iOS
        run: |
          # This is the step that was missing before: configure succeeding
          # only proves CMake could enumerate the targets and write project
          # files, not that the code compiles. This actually calls xcodebuild
          # (via CMake) and fails the job on any real compile/link error.
          cmake --build build --config Release --parallel 6

      - name: Dump CMake configure error
        if: failure() && steps.configure.outcome == 'failure'
        shell: bash
        run: |
          # Only useful for CONFIGURE-time failures — these two files only
          # capture CMake's own compiler-capability checks. If the "Build
          # for iOS" step failed instead, the real compiler/linker errors
          # are already printed directly in that step's own log above.
          find . -name "CMakeError.log" -exec cat {} \;
          find . -name "CMakeOutput.log" -exec cat {} \;